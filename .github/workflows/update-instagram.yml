name: Actualizar Instagram Posts

on:
  schedule:
    - cron: '0 */12 * * *' # Se ejecuta cada 12 horas
  workflow_dispatch: # Permite ejecución manual desde GitHub

# Evita que dos ejecuciones se pisen al hacer push
concurrency:
  group: instagram-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permite escribir en el repositorio
      actions: write   # Permite disparar el deploy tras subir cambios

    steps:
    - name: Checkout del código
      uses: actions/checkout@v5

    - name: Configurar Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar dependencias
      run: pip install -r requirements.txt

    - name: Ejecutar script de actualización
      env:
        INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      run: python api/update_instagram.py

    - name: Commit y Push de los cambios
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        # Solo los archivos que genera el script (-A incluye imágenes eliminadas)
        git add -A js/instagram_posts.json img/ service-worker.js

        if git diff --staged --quiet; then
          echo "No hay cambios para commitear"
        else
          # Leer el mensaje de commit generado por el script
          if [ -s commit_message.txt ]; then
            git commit -m "$(cat commit_message.txt)"
          else
            git commit -m "chore: actualizar posts de Instagram [bot]"
          fi
          git push
          echo "Cambios pusheados exitosamente"
          # Un push con GITHUB_TOKEN no dispara otros workflows: se lanza el deploy explícitamente
          gh workflow run deploy.yml --ref main
        fi
      env:
        GH_TOKEN: ${{ github.token }}
