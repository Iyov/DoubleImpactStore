name: Actualizar Instagram Posts

on:
  schedule:
    - cron: '0 */12 * * *' # Se ejecuta cada 12 horas
  workflow_dispatch: # Permite ejecución manual desde GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permite escribir en el repositorio

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar script de actualización
      env:
        INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      run: python api/update_instagram.py

    - name: Commit y Push de los cambios
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add .

        # Verificar si hay cambios staged
        if git diff --staged --quiet; then
          echo "No hay cambios para commitear"
        else
          # Leer el mensaje de commit generado por el script
          if [ -f commit_message.txt ] && [ -s commit_message.txt ]; then
            COMMIT_MSG=$(cat commit_message.txt)
            git commit -m "$COMMIT_MSG"
          else
            git commit -m "chore: actualizar posts de Instagram [bot]"
          fi
          git push
          echo "Cambios pusheados exitosamente"
        fi
