name: Update Instagram

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-instagram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests Pillow

      - name: Run Instagram Updater
        run: python api/update_instagram.py
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}

      - name: Commit and push changes
        run: |
          git config user.name "DoubleImpactStore Bot"
          git config user.email "bot@doubleimpactstore.cl"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualizar posts de Instagram [skip ci]"
            git push
          else
            echo "No hay cambios que commitear."
          fi