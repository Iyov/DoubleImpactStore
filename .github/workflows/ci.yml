name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v5

    - name: Configurar Node
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Configurar Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: requirements-dev.txt

    - name: Instalar dependencias
      run: |
        npm ci
        pip install -r requirements-dev.txt

    # Los artefactos (*.min.*, ?v=, ASSETS_HASH) están versionados en git:
    # si alguien editó fuentes sin ejecutar `npm run build`, falla aquí.
    - name: El build commiteado está al día
      run: |
        npm run build
        git diff --exit-code

    - name: Checks (siglas, manifest, marca, CSP, minificación)
      run: npm run check

    - name: Tests unitarios y property-based (Vitest + fast-check)
      run: npm test

    - name: Tests de Python (pytest)
      run: npm run test:py

    - name: Sitio público sin referencias rotas
      run: npm run site

    - name: Instalar Chromium para Playwright
      run: npx playwright install --with-deps chromium

    - name: Tests E2E (Playwright)
      run: npm run test:e2e

    - name: Reporte de Playwright
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 7
